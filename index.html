<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Accounting Portal</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 500px; margin: 40px auto; border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    .hidden { display: none; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .stat-box { background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
    .stat-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .stat-value { font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    .error { color: #f87171; font-size: 14px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SECTION -->
  <div id="loginSection" class="card">
    <h2>Executive Access</h2>
    <label for="phone">Enter Registered Phone Number</label>
    <input type="tel" id="phone" placeholder="e.g. 09051004353" required>
    <button onclick="handleLogin()">Sign In</button>
    <div id="loginError" class="error"></div>
  </div>

  <!-- 2. EXECUTIVE DASHBOARD -->
  <div id="dashboardSection" class="card hidden" style="max-width: 800px;">
    <h2>Statutory Financial Portal</h2>
    <p id="welcomeMsg" style="text-align: center; color: #94a3b8;"></p>
    
    <div id="adminPanel" class="hidden">
      <h3>Executive Summary</h3>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-title">Journal Records</div>
          <div id="journalCount" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">Fixed Assets</div>
          <div id="assetCount" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">Investments</div>
          <div id="investmentCount" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">Appropriations</div>
          <div id="appropriationCount" class="stat-value">0</div>
        </div>
      </div>
    </div>
    
    <button onclick="location.reload()" style="margin-top: 24px; background: #334155;">Sign Out</button>
  </div>

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

    async function handleLogin() {
      const phone = document.getElementById('phone').value.trim();
      const errDiv = document.getElementById('loginError');
      errDiv.innerText = '';

      if (!phone) {
        errDiv.innerText = 'Please enter your phone number.';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });

        const data = await res.json();

        if (!res.ok) {
          errDiv.innerText = data.error || 'Login failed';
          return;
        }

        // Hide login, show dashboard
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('welcomeMsg').innerText = `Welcome, ${data.member.full_name} (${data.member.role.toUpperCase()})`;

        if (data.member.role === 'admin') {
          document.getElementById('adminPanel').classList.remove('hidden');
          loadExecutiveReport(phone);
        }
      } catch (err) {
        errDiv.innerText = 'Unable to connect to service server.';
      }
    }

    async function loadExecutiveReport(userPhone) {
      try {
        const res = await fetch(`${API_URL}/api/reports/statutory`, {
          headers: { 'x-user-phone': userPhone }
        });
        const report = await res.json();

        if (report.success) {
          document.getElementById('journalCount').innerText = report.data.journalSummary.length;
          document.getElementById('assetCount').innerText = report.data.fixedAssets.length;
          document.getElementById('investmentCount').innerText = report.data.investments.length;
          document.getElementById('appropriationCount').innerText = report.data.appropriations.length;
        }
      } catch (err) {
        console.error('Failed loading statutory financial reports', err);
      }
    }
  </script>
</body>
</html>
